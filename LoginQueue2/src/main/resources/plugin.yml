name: LoginQueue2
version: '${project.version}'
main: top.mcocet.loginqueue2.LoginQueue
api-version: '1.13'
authors: [MCOCET]
description: 登录队列
website: https://home.mcocet.top

# 自定义消息通道（Paper 1.21+ 必须全小写，BungeeCord 为内置通道无需声明）
channels:
  - loginqueue2:connectother
  - loginqueue2:connectrequest
  - loginqueue2:serverinfo
  - loginqueue2:loginsuccess
commands:
  logseq:
    description: LoginQueue 主命令
    usage: /logque <skip|list|status|help>
    aliases: [lq,ls,logseq]
  ls:
    description: LoginQueue 主命令别名
    usage: /lq <skip|list|status|help>
  join:
    description: 加入登录排队队列
    usage: /join
  register:
    description: 注册账号
    usage: /register <密码> <确认密码>
  login:
    description: 登录账号
    usage: /login <密码>
  changepassword:
    description: 修改密码
    usage: /changepassword <旧密码> <新密码>
    aliases: [changepw]
permissions:
  loginqueue2.admin.skip:
    description: 允许跳过排队
    default: op
  loginqueue2.admin.list:
    description: 允许查看排队列表
    default: op
  loginqueue2.admin.status:
    description: 允许查看服务器状态
    default: op
  loginqueue2.admin.refresh:
    description: 允许手动刷新服务器状态
    default: op
  loginqueue2.admin.promote:
    description: 允许将玩家排队位置前进一位
    default: op
  loginqueue2.admin.bypass:
    description: 不受登录服限制
    default: op
