name: LoginSequence
version: '${project.version}'
main: top.mcocet.loginsequence2.LoginSequence
api-version: '1.13'
authors: [MCOCET]
description: 登录队列
website: https://home.mcocet.top

# 自定义消息通道（Paper 1.21+ 必须全小写，BungeeCord 为内置通道无需声明）
channels:
  - loginsequence:connectother
  - loginsequence:connectrequest
  - loginsequence:serverinfo
  - loginsequence:loginsuccess
commands:
  logseq:
    description: LoginSequence 主命令
    usage: /logseq <skip|list|status|help>
    aliases: [ls]
  ls:
    description: LoginSequence 主命令别名
    usage: /ls <skip|list|status|help>
  join:
    description: 加入登录排队队列
    usage: /join
  register:
    description: 注册账号
    usage: /register <密码> <确认密码>
  login:
    description: 登录账号
    usage: /login <密码>
  changepassword:
    description: 修改密码
    usage: /changepassword <旧密码> <新密码>
    aliases: [changepw]
permissions:
  loginsequence.admin.skip:
    description: 允许跳过排队
    default: op
  loginsequence.admin.list:
    description: 允许查看排队列表
    default: op
  loginsequence.admin.status:
    description: 允许查看服务器状态
    default: op
  loginsequence.admin.refresh:
    description: 允许手动刷新服务器状态
    default: op
  loginsequence.admin.bypass:
    description: 不受登录服限制
    default: op
