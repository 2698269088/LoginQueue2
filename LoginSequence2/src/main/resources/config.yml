# 插件语言（支持 zh_CN、zh_TW、en_US）
language: zh_CN

# 是否启用 BungeeCord 通道扩展（需要配合 LoginSequence2BC 使用）
enable-bungee-extension: true

# 登录队列配置
queue:
  # 主服务器在 BungeeCord 中的名称
  main-server: "main"
  # 主服务器最大可连接玩家数（通过配置文件设置）
  max-online: 50
  # 排序优先级（越靠前优先级越高）
  # 支持 permission:xxx 和 name:xxx 两种匹配方式
  priority:
    - "permission:loginsequence.vip"
    - "permission:loginsequence.priority"
    - "name:Player1"
  # 默认优先级（数字越大越优先）
  default-priority: 0
  # 向 BungeeCord 刷新主服信息的周期（秒）
  refresh-interval: 5
  # 主服务器离线时的刷新周期（秒）
  offline-refresh-interval: 10
  # 主服务器连接阈值（0.0 - 1.0），超过此百分比时暂停放行新玩家
  threshold: 0.8
  # 是否限制排队中的玩家移动
  restrict-movement: false
  # 是否开启性能节省模式（禁用生物生成、时间流逝、天气更替）
  performance-mode: true
  # 玩家加入后是否自动进入排队队列
  auto-queue: false
  # 玩家加入后锁定等待的时间（秒），在此期间玩家无法交互
  lock-time: 3
  # 是否设置玩家加入后的游戏模式
  set-gamemode: true
  # 玩家加入后的游戏模式（SURVIVAL, CREATIVE, ADVENTURE, SPECTATOR）
  gamemode: ADVENTURE
  # 是否允许玩家与方块交互（点击按钮、开门等）
  allow-block-interact: false
  # 是否允许玩家放置方块
  allow-block-place: false
  # 是否允许玩家破坏方块
  allow-block-break: false
  # 是否禁用下界维度（禁止玩家进入或传送到 NETHER）
  disable-nether: true
  # 是否禁用末地维度（禁止玩家进入或传送到 THE_END）
  disable-end: true
  # 是否禁用传送门（禁止玩家通过任何传送门进行传送）
  disable-portals: true
  # 管理员是否不受上述限制（拥有 loginsequence.admin.bypass 权限）
  admin-bypass: true
  # 是否限制玩家活动范围（超出范围拉回中心）
  restrict-range: false
  # 玩家活动范围限制（以出生点为中心，单位为方块）
  range-limit: 10
  # 登录点保护（禁止爆炸、取消玩家伤害、禁止 PVP）
  spawn-protection: true
  # 登录点保护区域半径（以出生点为中心，0 表示全地图保护）
  spawn-protection-radius: 0
  # 玩家出生点配置
  spawn:
    # 出生点世界
    world: "world"
    # 出生点中心 X 坐标
    x: 0.0
    # 出生点中心 Y 坐标
    y: -63.0
    # 出生点中心 Z 坐标
    z: 0.0
    # 出生点朝向（俯仰角）
    pitch: 0.0
    # 出生点朝向（偏航角）
    yaw: 0.0
    # 随机出生半径（在中心点周围此半径内随机生成位置，0 表示固定位置）
    radius: 8..5
  # 手动排队时发放的物品配置
  queue-item:
    # 物品所在槽位（0-8 为主手栏）
    slot: 4
    # 物品类型
    material: BEACON
    # 物品显示名称
    name: "&a加入游戏"
messages:
  waiting: "&a[登录队列] &f你当前排在第 &e{position} &f位，主服在线 &e{online}&f/&e{max}&f，请耐心等待..."
  entering: "&a[登录队列] &f你可以进入服务器了！"
  main-offline: "&c[登录队列] &f主服务器当前离线，请稍后再试..."
  threshold-reached: "&c[登录队列] &f主服务器负载较高，排队暂停，请耐心等待..."
  manual-queue-hint: "&a[登录队列] &f请左击物品栏中的“加入游戏”按钮"
